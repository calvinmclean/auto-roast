version: "3"

tasks:
  serial-test:
    aliases: ["st"]
    dir: ./tester
    cmds:
      - go test

  flash:
    aliases: ["f"]
    desc: "Flash firmware: task flash -- [pico|xiao-rp2040] (default: pico)"
    vars:
      FIRMWARE_TARGET: '{{ .CLI_ARGS | default "pico" }}'
    preconditions:
      - sh: 'test "{{ .FIRMWARE_TARGET }}" = "pico" || test "{{ .FIRMWARE_TARGET }}" = "xiao-rp2040"'
        msg: 'unsupported target {{ .FIRMWARE_TARGET }}; choose pico or xiao-rp2040'
    cmds:
      - tinygo flash -target={{ .FIRMWARE_TARGET }} ./firmware

  flash-monitor:
    aliases: ["fm"]
    desc: "Flash and monitor: task flash-monitor -- [pico|xiao-rp2040] (default: pico)"
    vars:
      FIRMWARE_TARGET: '{{ .CLI_ARGS | default "pico" }}'
    preconditions:
      - sh: 'test "{{ .FIRMWARE_TARGET }}" = "pico" || test "{{ .FIRMWARE_TARGET }}" = "xiao-rp2040"'
        msg: 'unsupported target {{ .FIRMWARE_TARGET }}; choose pico or xiao-rp2040'
    cmds:
      - tinygo flash -target={{ .FIRMWARE_TARGET }} -monitor ./firmware

  build:
    aliases: ["b"]
    desc: "Build firmware: task build -- [pico|xiao-rp2040] (default: pico)"
    vars:
      FIRMWARE_TARGET: '{{ .CLI_ARGS | default "pico" }}'
    preconditions:
      - sh: 'test "{{ .FIRMWARE_TARGET }}" = "pico" || test "{{ .FIRMWARE_TARGET }}" = "xiao-rp2040"'
        msg: 'unsupported target {{ .FIRMWARE_TARGET }}; choose pico or xiao-rp2040'
    cmds:
      - tinygo build -o .build/auto-roast-{{ .FIRMWARE_TARGET }}.elf -target={{ .FIRMWARE_TARGET }} ./firmware

  run:
    aliases: ["r"]
    env:
      TWCHART_ADDR: http://localhost:8080
      # TWCHART_ADDR: http://server.local:8087
    cmds:
      - go run cmd/auto-roast/main.go {{ .CLI_ARGS | default "-ui=false" }}

  dev:
    aliases: ["d"]
    env:
      SERIAL_PORT: none
      TWCHART_ADDR: mock
    cmds:
      - go run cmd/auto-roast/main.go {{ .CLI_ARGS | default "-session=dev -ui=false" }}

  devui:
    cmds:
      - go run cmd/auto-roast/main.go {{ .CLI_ARGS | default "-debug" }}

  package:
    cmds:
      - go build -o ./.build/auto-roast ./cmd/auto-roast
      - fyne package -os darwin -icon icon.png -exe .build/auto-roast -name .build/AutoRoast
